<!-- Попытка инжектнуть стили внутрь iframe, если iframe доступен same-origin.
     Если iframe cross-origin — постмессед либо инъекция не сработают,
     но внешние элементы всё равно будут оформлены. -->
<script>
(function(){
  const cssText = document.getElementById('chatbase-overrides').innerText;
  function injectToIframe(iframe){
    if(!iframe) return false;
    try{
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      if(!doc) return false;
      const s = doc.createElement('style');
      s.setAttribute('data-from','page-chatbase-override');
      s.innerHTML = cssText;
      doc.head && doc.head.appendChild(s);
      console.log('[chatbase override] injected into iframe (same-origin).');
      return true;
    }catch(err){
      console.warn('[chatbase override] cannot access iframe document (probably cross-origin).', err);
      // Fallback: try postMessage — embed might listen for such messages (depends on Chatbase impl).
      try{
        iframe.contentWindow.postMessage({ type: 'CHATBASE:INJECT_CSS', css: cssText }, '*');
        console.log('[chatbase override] posted message to iframe (fallback).');
      }catch(e){ /* ignore */ }
      return false;
    }
  }

  function findIframeAndInject(){
    // iframe может находиться внутри #chatbase-bubble-window или вложен по-другому
    const container = document.getElementById('chatbase-bubble-window');
    if(container){
      const ifr = container.querySelector('iframe');
      if(ifr) return injectToIframe(ifr);
    }
    // еще пробуем найти любой iframe, который был добавлен скриптом Chatbase
    const anyIframe = document.querySelector('iframe[src*="chatbase"]') || document.querySelector('iframe');
    if(anyIframe) return injectToIframe(anyIframe);
    return false;
  }

  // Попытки: при загрузке страницы и через сообщения "iframeReady"
  window.addEventListener('message', (ev) => {
    // если embed шлёт сообщение о готовности, попробуем инжект
    try{
      const data = ev.data;
      if(typeof data === 'object' && (data === 'iframeReady' || data?.type === 'iframeReady' || data?.type === 'IFRAME_READY')){
        setTimeout(findIframeAndInject, 300);
      }
      // В некоторых реализациях embed принимает {type:'INJECT_CSS'} — мы уже посылаем такое сообщение в catch
    }catch(e){}
  });

  // Также запускаем через таймауты — на случай если iframe создаётся позже
  setTimeout(findIframeAndInject, 1000);
  setTimeout(findIframeAndInject, 3000);
  setTimeout(findIframeAndInject, 7000);
})();
</script>

<script>
(function(){
  const body = document.body;
  const lamp = document.getElementById('themeLamp');
  const lampIcon = document.getElementById('lampIcon');
  const footerLogo = document.getElementById('footerLogo');
  const saved = localStorage.getItem('aqyl_theme');

  // Функция для обновления логотипов
  function updateLogos(isDark) {
    lampIcon.src = isDark ? 'img/logo.png' : 'img/darklogo.png';
    footerLogo.src = isDark ? 'img/logo.png' : 'img/darklogo.png';
  }

  // Настройка при загрузке
  const isDarkStart = (saved === 'dark');
  if (isDarkStart) body.classList.add('dark');
  updateLogos(isDarkStart);

  // Переключатель темы
  lamp.addEventListener('click', () => {
    body.classList.toggle('dark');
    const isDark = body.classList.contains('dark');
    localStorage.setItem('aqyl_theme', isDark ? 'dark' : 'light');
    updateLogos(isDark);
  });
})();
</script>

  <script>

    openModal.addEventListener('click', (e) => {
      e.preventDefault();
      modalBg.classList.add('show');

    closeModal.addEventListener('click', () => {
      modalBg.classList.remove('show');
      modalBg.setAttribute('aria-hidden', 'true');
    });

    modalBg.addEventListener('click', (e) => {
      if (e.target === modalBg) {
        modalBg.classList.remove('show');
        modalBg.setAttribute('aria-hidden', 'true');
      }
    });
  });

  <!-- NetRunner Chatbase -->
<script>
(function(){
  if(!window.chatbase || window.chatbase("getState")!=="initialized"){
    window.chatbase=(...arguments)=>{
      if(!window.chatbase.q){window.chatbase.q=[]}
      window.chatbase.q.push(arguments)
    };
    window.chatbase=new Proxy(window.chatbase,{
      get(target,prop){
        if(prop==="q"){return target.q}
        return(...args)=>target(prop,...args)
      }
    })
  }
  const onLoad=function(){
    const script=document.createElement("script");
    script.src="https://www.chatbase.co/embed.min.js";
    script.id="4R2oIwqP2YlECxoPg1DG5";  // 👈 это твой ID NetRunner
    script.domain="www.chatbase.co";
    document.body.appendChild(script)
  };
  if(document.readyState==="complete"){onLoad()}
  else{window.addEventListener("load",onLoad)}
})();
</script>
